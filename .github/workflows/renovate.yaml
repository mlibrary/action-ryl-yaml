name: Renovate
on:
  push:
    branches: [main]
  schedule: [cron: 0 6 * * *]
  workflow_dispatch: {}
permissions: {}
jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run Renovate
      uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
      env:
        RENOVATE_PLATFORM: github
        RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
        RENOVATE_TOKEN: ${{ github.token }}
        LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || 'info' }}
