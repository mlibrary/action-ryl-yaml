name: ryl-yaml
description: Lint yaml files
inputs:
  enforce_extension:
    description: >
      Shall we error if the file extension `.yml` is used? Defaults to `true`.
    type: boolean
    required: false
    default: true
  strict:
    description: >
      Use `--strict` flag (warnings return non-zero)? Defaults to `false`.
    type: boolean
    required: false
    default: false
  config:
    description: >
      Choose an action-bundled ryl config name, or `repo` to use repo supplied
      config. Defaults to `repo`. See README for list of bundled config options.
    type: string
    required: false
    default: repo
runs:
  using: composite
  steps:
  - name: Fail on invalid config
    shell: bash
    if: |-
      ${{ !((inputs.config == 'repo') ||
            (inputs.config == 'standard') ||
            (inputs.config == 'basic') ||
            (inputs.config == 'default') ||
            (inputs.config == 'relaxed')) }}
    run: |
      echo "Unsupported 'config' setting, must be one of: repo, standard, basic, default, relaxed"
      exit 1
  - name: Check yaml file extension
    shell: bash
    if: ${{ inputs.enforce_extension == 'true' }}
    run: |
      files=$(git ls-files '*.yml')
      if [ -n "$files" ]; then
        echo "::error::Use the .yaml extension instead of .yml for: $files"
        exit 1
      fi
  - name: Fail on unsupported runner
    if: |-
      ${{ !((runner.os == 'macOS' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'X64')) }}
    shell: bash
    run: |
      echo "Unsupported runner: os=${{ runner.os }} arch=${{ runner.arch }}"
      exit 1
  - name: Install ryl (x64)
    if: runner.arch == 'X64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.27.0
      digest: 8d494a2742d8f2d57a49bd7db38034650ca98200f08d0c733c4650cbf5ec026d
  - name: Install ryl (arm64)
    if: runner.arch == 'ARM64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.27.0
      digest: 25fdbd300dde7944bcc9e858984246e503cbc5a66cc3b5bee9f926925d4581b1
  - name: Install ryl (macOS)
    if: runner.os == 'macOS'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.27.0
      digest: a503a54647f72bb66eb48f2418b11f1d3baf4ef64bd83f80486feea9cf7f431b
  - name: Lint yaml w/ ryl (repo supplied config)
    shell: bash
    if: ${{ inputs.config == 'repo' }}
    run: ryl check "$GITHUB_WORKSPACE"
  - name: Lint yaml w/ ryl (action supplied config)
    shell: bash
    if: ${{ inputs.config != 'repo' }}
    env:
      ACTION_RYL_CONFIG_FILE: ${{ github.action_path }}/configs/${{ inputs.config }}.toml
    run: ryl check --config-file "$ACTION_RYL_CONFIG_FILE" "$GITHUB_WORKSPACE"
